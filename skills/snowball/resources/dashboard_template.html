<!DOCTYPE html>
<html lang="zh-Hant" data-tint="blue">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snowball · Minimalist Liquid Glass Portfolio Workbench</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* Automatic theme adaptation (inherits host/system color scheme) */
    html {
      --glass-bg: color-mix(in srgb, var(--card) 62%, transparent);
      --glass-sub: color-mix(in srgb, var(--secondary) 58%, transparent);
      --glass-border: color-mix(in srgb, var(--foreground) 12%, transparent);
      --glass-highlight: color-mix(in srgb, var(--foreground) 6%, transparent);
      --orb-opacity: 0.25;
    }

    /* 7 Rainbow Liquid Glass Tints (Red, Orange, Yellow, Green, Blue, Indigo, Violet) */
    [data-tint="red"]    { --tint-rgb: 239, 68, 68;  --tint-rgb2: 244, 63, 94;  --tint-hex: #ef4444; --tint-text: #ef4444; }
    [data-tint="orange"] { --tint-rgb: 249, 115, 22; --tint-rgb2: 251, 146, 60; --tint-hex: #f97316; --tint-text: #ea580c; }
    [data-tint="yellow"] { --tint-rgb: 234, 179, 8;  --tint-rgb2: 245, 158, 11; --tint-hex: #eab308; --tint-text: #ca8a04; }
    [data-tint="green"]  { --tint-rgb: 16, 185, 129; --tint-rgb2: 52, 211, 153; --tint-hex: #10b981; --tint-text: #059669; }
    [data-tint="blue"]   { --tint-rgb: 59, 130, 246; --tint-rgb2: 56, 189, 248; --tint-hex: #3b82f6; --tint-text: #2563eb; }
    [data-tint="indigo"] { --tint-rgb: 99, 102, 241; --tint-rgb2: 129, 140, 248;--tint-hex: #6366f1; --tint-text: #4f46e5; }
    [data-tint="violet"] { --tint-rgb: 168, 85, 247; --tint-rgb2: 192, 132, 252;--tint-hex: #a855f7; --tint-text: #9333ea; }

    @media (prefers-color-scheme: dark) {
      [data-tint="yellow"] { --tint-text: #facc15; }
      [data-tint="orange"] { --tint-text: #fb923c; }
      [data-tint="green"]  { --tint-text: #34d399; }
      [data-tint="blue"]   { --tint-text: #60a5fa; }
      [data-tint="indigo"] { --tint-text: #818cf8; }
      [data-tint="violet"] { --tint-text: #c084fc; }
      [data-tint="red"]    { --tint-text: #f87171; }
    }

    /* Ambient Liquid Glass Backdrop */
    .liquid-backdrop {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(62% 52% at 14% 10%, rgba(var(--tint-rgb), var(--orb-opacity)), transparent 70%),
        radial-gradient(54% 48% at 88% 18%, rgba(var(--tint-rgb2), calc(var(--orb-opacity) * 0.85)), transparent 72%),
        radial-gradient(58% 54% at 52% 92%, rgba(var(--tint-rgb), calc(var(--orb-opacity) * 0.65)), transparent 75%);
      transition: background 0.45s ease;
    }

    /* Minimalist Frosted Glass Surface */
    .glass {
      background: linear-gradient(
        145deg,
        color-mix(in srgb, var(--glass-bg) 92%, rgba(var(--tint-rgb), 0.10)),
        var(--glass-bg)
      );
      backdrop-filter: blur(24px) saturate(165%);
      -webkit-backdrop-filter: blur(24px) saturate(165%);
      border: 1px solid var(--glass-border);
      box-shadow:
        inset 0 1px 0 var(--glass-highlight),
        0 10px 30px -12px rgba(var(--tint-rgb), 0.14);
      transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }
    .glass-sub {
      background: var(--glass-sub);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border: 1px solid var(--glass-border);
    }
    .glass-accent {
      border-color: rgba(var(--tint-rgb), 0.38);
      box-shadow:
        inset 0 1px 0 var(--glass-highlight),
        0 10px 28px -10px rgba(var(--tint-rgb), 0.22);
    }
    .tint-text { color: var(--tint-text); }
    .tint-bg-soft { background-color: rgba(var(--tint-rgb), 0.14); color: var(--tint-text); }
    .tint-btn-active { background-color: rgb(var(--tint-rgb)); color: #ffffff; }
    .tint-ring:focus { outline: none; box-shadow: 0 0 0 2px rgba(var(--tint-rgb), 0.45); border-color: rgba(var(--tint-rgb), 0.6); }
    .swatch {
      width: 22px;
      height: 22px;
      border-radius: 9999px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 2px solid rgba(255, 255, 255, 0.65);
    }
    .swatch:hover { transform: scale(1.14); }
    .swatch.active {
      transform: scale(1.18);
      box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--tint-hex);
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased min-h-screen transition-colors duration-300">
  <div class="liquid-backdrop" aria-hidden="true"></div>

  <div class="max-w-5xl mx-auto px-4 py-7 md:px-8 md:py-10 space-y-7">

    <!-- Minimal Header + 7-Color Rainbow Swatches + Light/Dark Switch -->
    <header class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
      <div class="space-y-1">
        <div class="flex items-center gap-2.5">
          <span class="w-2.5 h-2.5 rounded-full" style="background: var(--tint-hex); box-shadow: 0 0 12px var(--tint-hex);"></span>
          <h1 id="hdr-title" class="text-2xl font-semibold tracking-tight">Snowball 全球投資儀表板</h1>
        </div>
        <p id="hdr-sub" class="text-xs text-[var(--muted-foreground)]">收盤基準 demo · 極簡毛玻璃版</p>
      </div>

      <div class="flex flex-wrap items-center gap-2.5">
        <!-- 7-Color Rainbow Glass Tint Selector -->
        <div class="glass rounded-full px-3 py-1.5 flex items-center gap-2" role="group" aria-label="七彩毛玻璃色調">
          <span class="text-xs text-[var(--muted-foreground)] mr-0.5 hidden sm:inline">色調</span>
          <button onclick="setTint('red')"    id="sw-red"    title="紅 Red"    aria-label="紅色毛玻璃" class="swatch" style="background:#ef4444;"></button>
          <button onclick="setTint('orange')" id="sw-orange" title="橙 Orange" aria-label="橙色毛玻璃" class="swatch" style="background:#f97316;"></button>
          <button onclick="setTint('yellow')" id="sw-yellow" title="黃 Yellow" aria-label="黃色毛玻璃" class="swatch" style="background:#eab308;"></button>
          <button onclick="setTint('green')"  id="sw-green"  title="綠 Green"  aria-label="綠色毛玻璃" class="swatch" style="background:#10b981;"></button>
          <button onclick="setTint('blue')"   id="sw-blue"   title="藍 Blue"   aria-label="藍色毛玻璃" class="swatch" style="background:#3b82f6;"></button>
          <button onclick="setTint('indigo')" id="sw-indigo" title="靛 Indigo" aria-label="靛色毛玻璃" class="swatch" style="background:#6366f1;"></button>
          <button onclick="setTint('violet')" id="sw-violet" title="紫 Violet" aria-label="紫色毛玻璃" class="swatch" style="background:#a855f7;"></button>
        </div>
      </div>
    </header>

    <!-- 1. 四大核心指標：總投入金額 / 總資產 / 每月投入 / 年報酬率 -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 tabular-nums">
      <div class="glass rounded-3xl p-5 space-y-1.5">
        <div class="text-xs text-[var(--muted-foreground)]">總投入金額</div>
        <div id="kpi-cost" class="text-2xl font-semibold tracking-tight">--</div>
        <div id="kpi-cost-sub" class="text-xs text-[var(--muted-foreground)]">--</div>
      </div>

      <div class="glass rounded-3xl p-5 space-y-1.5">
        <div class="text-xs text-[var(--muted-foreground)]">總資產</div>
        <div id="kpi-mv" class="text-2xl font-semibold tracking-tight">--</div>
        <div id="kpi-pnl" class="text-xs font-medium">--</div>
      </div>

      <div class="glass glass-accent rounded-3xl p-5 space-y-1.5">
        <label for="in-monthly" class="block text-xs font-medium tint-text">每月投入金額</label>
        <div class="flex items-baseline gap-2">
          <input
            id="in-monthly"
            type="number"
            min="0"
            max="500000"
            step="100"
            value="1000"
            oninput="syncMonthly(this.value)"
            class="w-full glass-sub tint-ring rounded-2xl px-3 py-1 text-xl font-semibold text-[var(--foreground)]"
          />
          <span id="unit-monthly" class="text-xs text-[var(--muted-foreground)] shrink-0">USD/月</span>
        </div>
        <div id="kpi-monthly-sub" class="text-xs text-[var(--muted-foreground)]">--</div>
      </div>

      <div class="glass rounded-3xl p-5 space-y-1.5">
        <label for="in-rate" class="block text-xs font-medium tint-text">預估年報酬率</label>
        <div class="flex items-baseline gap-2">
          <input
            id="in-rate"
            type="number"
            min="1"
            max="25"
            step="0.5"
            value="8.5"
            oninput="syncRate(this.value)"
            class="w-full glass-sub tint-ring rounded-2xl px-3 py-1 text-xl font-semibold text-[var(--foreground)]"
          />
          <span class="text-xs text-[var(--muted-foreground)] shrink-0">% / 年</span>
        </div>
        <div id="kpi-rate-sub" class="text-xs text-[var(--muted-foreground)]">--</div>
      </div>
    </section>

    <!-- 2. 未來一週行情與操作重點 -->
    <section class="glass rounded-3xl p-5 md:p-6 space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
        <div class="space-y-0.5">
          <h2 class="text-base font-semibold">未來一週行情與操作重點</h2>
          <p id="wk-period" class="text-xs text-[var(--muted-foreground)]">--</p>
        </div>
        <span id="wk-posture" class="self-start sm:self-auto px-3 py-1 rounded-full text-xs font-medium tint-bg-soft">--</span>
      </div>
      <p id="wk-summary" class="text-sm leading-relaxed text-[var(--foreground)] opacity-90">--</p>
      <div id="wk-actions" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
    </section>

    <!-- 3. 任務清單 -->
    <section class="glass rounded-3xl p-5 md:p-6 space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 id="tasks-title" class="text-base font-semibold">執行任務清單</h2>
          <p class="text-xs text-[var(--muted-foreground)]">點擊勾選即可自動記憶於本機瀏覽器</p>
        </div>
        <span id="task-counter" class="text-xs font-medium tint-text tabular-nums">0 / 3 完成</span>
      </div>
      <div id="tasks-list" class="space-y-2.5"></div>
    </section>

    <!-- 4. 持倉與未來一週操作指引 -->
    <section class="glass rounded-3xl p-5 md:p-6 space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
          <h2 class="text-base font-semibold">持倉與操作指引</h2>
          <p class="text-xs text-[var(--muted-foreground)]">只買不賣現金流再平衡：虧損部位不殺低，僅針對達標獲利標的減碼換股</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button onclick="toggleEdit()" id="btn-edit" class="glass-sub px-3 py-1.5 rounded-full text-xs font-medium hover:opacity-90 transition">編輯持股</button>
          <div class="glass-sub rounded-full p-1 inline-flex gap-0.5">
            <button onclick="setFilter('ALL')"  class="f-btn px-3 py-1 rounded-full text-xs font-medium transition" data-f="ALL">全部</button>
            <button onclick="setFilter('SELL')" class="f-btn px-3 py-1 rounded-full text-xs font-medium transition" data-f="SELL">待賣</button>
            <button onclick="setFilter('KEEP')" class="f-btn px-3 py-1 rounded-full text-xs font-medium transition" data-f="KEEP">續抱</button>
          </div>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm tabular-nums">
          <thead>
            <tr class="border-b border-[var(--glass-border)] text-xs text-[var(--muted-foreground)]">
              <th class="py-2.5 pr-3 font-medium">標的</th>
              <th class="py-2.5 px-2 text-right font-medium">股數</th>
              <th class="py-2.5 px-2 text-right font-medium">成本</th>
              <th class="py-2.5 px-2 text-right font-medium">現價</th>
              <th class="py-2.5 px-2 text-right font-medium">損益</th>
              <th class="py-2.5 pl-3 font-medium">該如何操作</th>
            </tr>
          </thead>
          <tbody id="holdings-tbody" class="divide-y divide-[var(--glass-border)]"></tbody>
        </table>
      </div>
    </section>

    <!-- 5. 年年複利計算 -->
    <section class="glass rounded-3xl p-5 md:p-6 space-y-5">
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div class="space-y-1">
          <h2 class="text-base font-semibold">年年複利計算（第 1 年 ～ 第 10 年）</h2>
          <p id="comp-summary" class="text-xs text-[var(--muted-foreground)]">--</p>
        </div>
        <div class="flex flex-wrap items-center gap-3 text-xs tabular-nums">
          <label class="flex items-center gap-1.5 text-[var(--muted-foreground)]">
            額外啟動金
            <input id="in-extra" type="number" min="0" max="500" step="1" value="0" oninput="syncExtra(this.value)"
              class="w-16 text-right glass-sub tint-ring rounded-xl px-2 py-1 font-semibold text-[var(--foreground)]" />
            <span id="unit-extra">千美元</span>
          </label>
        </div>
      </div>

      <!-- Minimal Glass SVG Chart -->
      <div class="glass-sub rounded-2xl p-4 space-y-2">
        <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)]">
          <span id="chart-title">每年年底總資產 vs. 累計總投入本金</span>
          <div class="flex gap-4">
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background: var(--tint-hex);"></span>總資產</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-slate-400/70 inline-block"></span>累計本金</span>
          </div>
        </div>
        <svg id="comp-svg" viewBox="0 0 760 240" class="w-full h-auto"></svg>
      </div>

      <!-- Year-by-Year Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm tabular-nums">
          <thead>
            <tr class="border-b border-[var(--glass-border)] text-xs text-[var(--muted-foreground)]">
              <th class="py-2.5 pr-3 font-medium">年份</th>
              <th class="py-2.5 px-2 text-right font-medium">累計總投入</th>
              <th class="py-2.5 px-2 text-right font-medium">預估總資產</th>
              <th class="py-2.5 px-2 text-right font-medium">累計淨利</th>
              <th class="py-2.5 pl-2 text-right font-medium">當年預估股息 / 每月被動</th>
            </tr>
          </thead>
          <tbody id="comp-tbody" class="divide-y divide-[var(--glass-border)]"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    /*__DATA_START__*/
    const DASHBOARD_DATA = {
  "storageKey": "snowball_glass_open_v2",
  "title": "Snowball 全球投資儀表板",
  "subtitle": "v5 實證多因子 · 只買不賣現金流再平衡",
  "priceDate": "demo",
  "baseCurrency": "USD",
  "fxUsdTwd": 32.5,
  "fxToBase": {
    "USD": 1.0,
    "TWD": 0.0308,
    "EUR": 1.08,
    "JPY": 0.0065,
    "HKD": 0.128,
    "GBP": 1.27
  },
  "defaultMonthly": 1000,
  "defaultRate": 8.5,
  "defaultTint": "blue",
  "coreRatio": 0.6,
  "coreLabel": "核心 ETF",
  "tasksTitle": "每週紀律任務清單",
  "weeklyOutlook": {
    "period": "未來一週市場觀察（Global v5）",
    "posture": "紀律分批 · 逢回加碼不追高",
    "summary": "全球股債受利率預期與財報輪動影響，短線以區間震盪為主。維持每月固定現金流投入核心全球 ETF，衛星資金優先流向 v5 排名前 20% 且低估值標的。",
    "actions": [
      {
        "label": "核心定投",
        "title": "按表執行每月核心買進",
        "detail": "將本月 60% 資金固定投入全球核心 ETF，平滑波動並累積複利底倉。"
      },
      {
        "label": "衛星狙擊",
        "title": "聚焦 v5 前 20% 強勢低估股",
        "detail": "剩餘 40% 資金從觀察清單中挑選 v5 排名靠前且尚未超重的標的逢回分批買入。"
      },
      {
        "label": "風控紀律",
        "title": "達標贏家減碼 · 虧損不亂砍",
        "detail": "僅在單一獲利部位觸及目標賣價或權重超標時獲利了結，回收資金再滾入核心。"
      }
    ]
  },
  "tasks": [
    {
      "id": "t1",
      "title": "執行本月核心 ETF 定期定額扣款",
      "desc": "固定投入核心比例資金，維持長期紀律與低交易成本。"
    },
    {
      "id": "t2",
      "title": "檢視 v5 全球排行榜更新衛星名單",
      "desc": "透過 global_ranker.py 檢查 US / EU / JP / HK / TW 前 20% 候選標的。"
    },
    {
      "id": "t3",
      "title": "檢查達標獲利持股是否觸及減碼線",
      "desc": "遵守只買不賣原則，僅對獲利超重或達目標賣價部位執行獲利換股。"
    }
  ],
  "holdings": [
    { "mkt": "US", "currency": "USD", "code": "VT", "name": "Vanguard Total World Stock ETF", "shares": 10, "cost": 115.0, "price": 120.0, "sellList": false, "tag": "加碼", "action": "全球核心底倉，每月固定定期定額" },
    { "mkt": "US", "currency": "USD", "code": "GOOGL", "name": "Alphabet Inc.", "shares": 2, "cost": 250.0, "price": 280.0, "sellList": false, "tag": "續抱", "action": "美股成長衛星，趨勢穩健續抱" },
    { "mkt": "TW", "currency": "TWD", "code": "0056", "name": "Yuanta Taiwan High Dividend ETF", "shares": 100, "cost": 40.0, "price": 42.0, "sellList": false, "tag": "加碼", "action": "台股高息核心，定期累積現金流" },
    { "mkt": "JP", "currency": "JPY", "code": "8306.T", "name": "Mitsubishi UFJ Financial Group", "shares": 100, "cost": 1600.0, "price": 1750.0, "sellList": true, "tag": "待賣", "action": "日股價值衛星：反彈至 ¥2,200 獲利減碼" }
  ],
  "screener": []
};
    /*__DATA_END__*/

    const TINT_HEX = {
      red: "#ef4444", orange: "#f97316", yellow: "#eab308",
      green: "#10b981", blue: "#3b82f6", indigo: "#6366f1", violet: "#a855f7"
    };
    const CURR_PREFIX = { USD: "$", JPY: "¥", EUR: "€", HKD: "HK$", GBP: "£", TWD: "" };

    let state = {
      tint: DASHBOARD_DATA.defaultTint || "blue",
      monthly: DASHBOARD_DATA.defaultMonthly,
      extra: 0,
      rate: DASHBOARD_DATA.defaultRate || 8.5,
      filter: "ALL",
      editMode: false,
      doneTasks: {},
      holdings: JSON.parse(JSON.stringify(DASHBOARD_DATA.holdings || []))
    };

    function isUsdBase() {
      return (DASHBOARD_DATA.baseCurrency || "TWD").toUpperCase() === "USD";
    }
    function fmtBase(n) {
      const r = Math.round(n).toLocaleString();
      return isUsdBase() ? `$${r}` : `${r} 元`;
    }
    function fxFor(h) {
      const map = DASHBOARD_DATA.fxToBase || {};
      const c = (h.currency || (h.mkt === "US" ? "USD" : h.mkt === "JP" ? "JPY" : h.mkt === "EU" ? "EUR" : h.mkt === "HK" ? "HKD" : "TWD")).toUpperCase();
      if (typeof map[c] === "number") return map[c];
      return h.mkt === "US" ? (DASHBOARD_DATA.fxUsdTwd || 32.5) : 1;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(DASHBOARD_DATA.storageKey);
        if (!raw) return;
        const s = JSON.parse(raw);
        if (s.tint && TINT_HEX[s.tint]) state.tint = s.tint;
        if (typeof s.monthly === "number") state.monthly = s.monthly;
        if (typeof s.extra === "number") state.extra = s.extra;
        if (typeof s.rate === "number") state.rate = s.rate;
        if (s.doneTasks) state.doneTasks = s.doneTasks;
        if (Array.isArray(s.holdings)) {
          const map = Object.fromEntries(s.holdings.map(x => [x.code, x]));
          state.holdings = (DASHBOARD_DATA.holdings || []).map(live => {
            const m = map[live.code];
            return m ? { ...live, shares: m.shares, cost: m.cost } : { ...live };
          });
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(DASHBOARD_DATA.storageKey, JSON.stringify({
          tint: state.tint,
          monthly: state.monthly,
          extra: state.extra,
          rate: state.rate,
          doneTasks: state.doneTasks,
          holdings: state.holdings.map(h => ({ code: h.code, shares: h.shares, cost: h.cost }))
        }));
      } catch (e) {}
    }

    function totals() {
      let cost = 0, mv = 0;
      state.holdings.forEach(h => {
        const fx = fxFor(h);
        cost += h.shares * h.cost * fx;
        mv += h.shares * h.price * fx;
      });
      return { cost, mv, pnl: mv - cost, pct: cost > 0 ? (mv / cost - 1) * 100 : 0 };
    }

    function setTint(tint) {
      if (!TINT_HEX[tint]) return;
      state.tint = tint;
      document.documentElement.setAttribute("data-tint", tint);
      Object.keys(TINT_HEX).forEach(k => {
        const el = document.getElementById("sw-" + k);
        if (el) el.classList.toggle("active", k === tint);
      });
      saveState();
      renderCompounding();
    }

    function renderKPIs() {
      const t = totals();
      document.getElementById("hdr-title").textContent = DASHBOARD_DATA.title || "Snowball 全球投資儀表板";
      document.getElementById("hdr-sub").textContent = `收盤基準 ${DASHBOARD_DATA.priceDate} · ${DASHBOARD_DATA.subtitle || "極簡毛玻璃版"}`;
      document.getElementById("unit-monthly").textContent = isUsdBase() ? "USD/月" : "元/月";
      document.getElementById("unit-extra").textContent = isUsdBase() ? "千美元" : "萬";

      document.getElementById("kpi-cost").textContent = fmtBase(t.cost);
      document.getElementById("kpi-cost-sub").textContent = `未來一年將再投入 ${fmtBase(state.monthly * 12)}`;
      document.getElementById("kpi-mv").textContent = fmtBase(t.mv);

      const pnlEl = document.getElementById("kpi-pnl");
      const sign = t.pnl >= 0 ? "+" : "-";
      pnlEl.textContent = `未實現損益 ${sign}${fmtBase(Math.abs(t.pnl))} (${t.pct >= 0 ? "+" : ""}${t.pct.toFixed(1)}%)`;
      pnlEl.className = `text-xs font-medium ${t.pnl >= 0 ? "text-emerald-500" : "text-rose-500"}`;

      const ratio = typeof DASHBOARD_DATA.coreRatio === "number" ? DASHBOARD_DATA.coreRatio : 0.6;
      const roundUnit = isUsdBase() ? 10 : 100;
      const core = Math.round(state.monthly * ratio / roundUnit) * roundUnit;
      const sat = Math.max(0, state.monthly - core);
      document.getElementById("kpi-monthly-sub").textContent = `${DASHBOARD_DATA.coreLabel || "核心"} ${fmtBase(core)} ＋ 衛星 ${fmtBase(sat)}`;
      document.getElementById("kpi-rate-sub").textContent = `目前帳面累計報酬 ${t.pct >= 0 ? "+" : ""}${t.pct.toFixed(1)}% · 已連動複利試算`;
    }

    function renderWeeklyOutlook() {
      const w = DASHBOARD_DATA.weeklyOutlook;
      if (!w) return;
      document.getElementById("wk-period").textContent = w.period || "";
      document.getElementById("wk-posture").textContent = w.posture || "";
      document.getElementById("wk-summary").textContent = w.summary || "";
      document.getElementById("wk-actions").innerHTML = (w.actions || []).map(a => `
        <div class="glass-sub rounded-2xl p-4 space-y-1">
          <div class="text-xs font-medium tint-text">${a.label}</div>
          <div class="text-sm font-semibold">${a.title}</div>
          <div class="text-xs text-[var(--muted-foreground)] leading-relaxed">${a.detail}</div>
        </div>
      `).join("");
    }

    function toggleTask(id) {
      state.doneTasks[id] = !state.doneTasks[id];
      saveState();
      renderTasks();
    }

    function renderTasks() {
      document.getElementById("tasks-title").textContent = DASHBOARD_DATA.tasksTitle || "執行任務清單";
      const tasks = DASHBOARD_DATA.tasks || [];
      const doneCount = tasks.filter(t => state.doneTasks[t.id]).length;
      document.getElementById("task-counter").textContent = `${doneCount} / ${tasks.length} 完成`;
      document.getElementById("tasks-list").innerHTML = tasks.map(t => {
        const checked = !!state.doneTasks[t.id];
        return `
          <label class="flex items-start gap-3 p-3.5 rounded-2xl glass-sub cursor-pointer hover:opacity-95 transition">
            <input type="checkbox" ${checked ? "checked" : ""} onchange="toggleTask('${t.id}')" class="mt-0.5 rounded" style="accent-color: var(--tint-hex);" />
            <div class="space-y-0.5 ${checked ? "opacity-50 line-through" : ""}">
              <div class="text-sm font-medium">${t.title}</div>
              <div class="text-xs text-[var(--muted-foreground)]">${t.desc}</div>
            </div>
          </label>
        `;
      }).join("");
    }

    function setFilter(f) {
      state.filter = f;
      document.querySelectorAll(".f-btn").forEach(b => {
        b.className = b.dataset.f === f
          ? "f-btn px-3 py-1 rounded-full text-xs font-semibold tint-btn-active transition"
          : "f-btn px-3 py-1 rounded-full text-xs font-medium text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition";
      });
      renderHoldings();
    }

    function toggleEdit() {
      state.editMode = !state.editMode;
      const b = document.getElementById("btn-edit");
      b.textContent = state.editMode ? "完成編輯" : "編輯持股";
      b.className = state.editMode
        ? "px-3 py-1.5 rounded-full text-xs font-semibold tint-btn-active transition"
        : "glass-sub px-3 py-1.5 rounded-full text-xs font-medium hover:opacity-90 transition";
      renderHoldings();
    }

    function editHold(code, field, val) {
      const h = state.holdings.find(x => x.code === code);
      if (!h) return;
      h[field] = Math.max(0, Number(val) || 0);
      saveState();
      renderKPIs();
      renderCompounding();
    }

    function renderHoldings() {
      const rows = state.holdings.filter(h => {
        if (state.filter === "SELL") return h.sellList;
        if (state.filter === "KEEP") return !h.sellList;
        return true;
      });
      const tagColor = {
        "待賣": "bg-amber-500/15 text-amber-500",
        "加碼": "tint-bg-soft",
        "續抱": "bg-sky-500/15 text-sky-500",
        "凍結": "glass-sub text-[var(--muted-foreground)]"
      };
      document.getElementById("holdings-tbody").innerHTML = rows.map(h => {
        const pct = h.cost > 0 ? (h.price / h.cost - 1) * 100 : 0;
        const currCode = (h.currency || (h.mkt === "US" ? "USD" : h.mkt === "JP" ? "JPY" : h.mkt === "EU" ? "EUR" : h.mkt === "HK" ? "HKD" : "TWD")).toUpperCase();
        const curr = CURR_PREFIX[currCode] ?? "";
        const shCell = state.editMode
          ? `<input type="number" step="any" value="${h.shares}" onchange="editHold('${h.code}','shares',this.value)" class="w-20 text-right glass-sub tint-ring rounded-lg px-1.5 py-0.5 text-xs" />`
          : `${h.shares}`;
        const cCell = state.editMode
          ? `<input type="number" step="0.01" value="${h.cost}" onchange="editHold('${h.code}','cost',this.value)" class="w-20 text-right glass-sub tint-ring rounded-lg px-1.5 py-0.5 text-xs" />`
          : `${curr}${h.cost.toFixed(2)}`;
        return `
          <tr class="hover:bg-[var(--glass-sub)] transition">
            <td class="py-3 pr-3"><div class="font-semibold">${h.code} ${h.name}</div><div class="text-xs text-[var(--muted-foreground)]">${h.mkt}</div></td>
            <td class="py-3 px-2 text-right">${shCell}</td>
            <td class="py-3 px-2 text-right text-[var(--muted-foreground)]">${cCell}</td>
            <td class="py-3 px-2 text-right font-medium">${curr}${h.price.toFixed(2)}</td>
            <td class="py-3 px-2 text-right font-semibold ${pct >= 0 ? "text-emerald-500" : "text-rose-500"}">${pct >= 0 ? "+" : ""}${pct.toFixed(1)}%</td>
            <td class="py-3 pl-3">
              <span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium mr-1.5 ${tagColor[h.tag] || tagColor["凍結"]}">${h.tag}</span>
              <span class="text-xs text-[var(--muted-foreground)]">${h.action}</span>
            </td>
          </tr>
        `;
      }).join("");
    }

    function syncMonthly(v) {
      state.monthly = Math.max(0, Number(v) || 0);
      saveState();
      renderKPIs();
      renderCompounding();
    }
    function syncExtra(v) {
      state.extra = Math.max(0, Number(v) || 0);
      saveState();
      renderCompounding();
    }
    function syncRate(v) {
      state.rate = Math.max(0, Math.min(30, Number(v) || 0));
      saveState();
      renderKPIs();
      renderCompounding();
    }

    function renderCompounding() {
      const t = totals();
      const usd = isUsdBase();
      const unitDiv = usd ? 1000 : 10000;
      const unitLabel = usd ? "k" : "萬";
      const milestone = usd ? 100000 : 1000000;
      const milestoneText = usd ? "$100k" : "100萬";

      const extraBase = state.extra * unitDiv;
      const annualIn = state.monthly * 12;
      const r = state.rate / 100;
      const divYield = state.rate <= 9 ? 0.055 : 0.04;

      let val = t.mv + extraBase;
      let cost = t.cost + extraBase;
      const series = [{ y: 0, label: "現在", cost, val, div: val * divYield }];
      let milYr = val >= milestone ? 0 : null;

      for (let y = 1; y <= 10; y++) {
        val = val * (1 + r) + annualIn * (1 + r * 0.5);
        cost += annualIn;
        if (milYr === null && val >= milestone) milYr = y;
        series.push({ y, label: `第 ${y} 年`, cost, val, div: val * divYield });
      }

      const y10 = series[10];
      document.getElementById("chart-title").textContent = usd
        ? "每年年底總資產 vs. 累計總投入本金（千美元）"
        : "每年年底總資產 vs. 累計總投入本金（萬元）";
      document.getElementById("comp-summary").textContent =
        `以每月投入 ${fmtBase(state.monthly)}、年化 ${state.rate.toFixed(1)}% 試算：` +
        (milYr !== null ? `第 ${milYr} 年突破 ${milestoneText}，` : "") +
        `第 10 年總資產約 ${usd ? "$" : ""}${(y10.val / unitDiv).toFixed(1)}${unitLabel}（每月被動股息約 ${fmtBase(y10.div / 12)}）。`;

      document.getElementById("comp-tbody").innerHTML = series.slice(1).map(d => {
        const net = d.val - d.cost;
        const isMil = d.y === milYr;
        return `
          <tr class="${isMil ? "font-semibold" : "hover:bg-[var(--glass-sub)]"} transition" style="${isMil ? "background: rgba(var(--tint-rgb), 0.12);" : ""}">
            <td class="py-2.5 pr-3">${d.label}${isMil ? ` ★破${milestoneText}` : ""}</td>
            <td class="py-2.5 px-2 text-right text-[var(--muted-foreground)]">${fmtBase(d.cost)}</td>
            <td class="py-2.5 px-2 text-right font-semibold">${fmtBase(d.val)}</td>
            <td class="py-2.5 px-2 text-right ${net >= 0 ? "text-emerald-500" : "text-rose-500"}">${net >= 0 ? "+" : "-"}${fmtBase(Math.abs(net))}</td>
            <td class="py-2.5 pl-2 text-right text-[var(--muted-foreground)]">${fmtBase(d.div)} / <span class="tint-text font-medium">${fmtBase(d.div / 12)}</span></td>
          </tr>
        `;
      }).join("");

      const svg = document.getElementById("comp-svg");
      const maxV = Math.max(milestone * 0.15, ...series.map(d => d.val)) * 1.15;
      const W = 760, H = 240, pL = 52, pR = 16, pT = 22, pB = 28;
      const plotW = W - pL - pR, plotH = H - pT - pB;
      const step = plotW / series.length;
      const accentHex = TINT_HEX[state.tint] || "#3b82f6";

      let out = "";
      for (let g = 0; g <= 4; g++) {
        const y = pT + plotH * (1 - g / 4);
        out += `<line x1="${pL}" y1="${y}" x2="${W - pR}" y2="${y}" stroke="currentColor" stroke-opacity="0.10" />`;
        out += `<text x="${pL - 8}" y="${y + 4}" text-anchor="end" font-size="12" fill="currentColor" opacity="0.55">${Math.round((maxV * g / 4) / unitDiv)}${unitLabel}</text>`;
      }
      if (milestone <= maxV) {
        const yM = pT + plotH * (1 - milestone / maxV);
        out += `<line x1="${pL}" y1="${yM}" x2="${W - pR}" y2="${yM}" stroke="${accentHex}" stroke-dasharray="4,4" stroke-opacity="0.7" stroke-width="1.5" />`;
        out += `<text x="${W - pR}" y="${yM - 5}" text-anchor="end" font-size="12" fill="${accentHex}" font-weight="600">${milestoneText}</text>`;
      }
      series.forEach((d, idx) => {
        const cx = pL + idx * step + step / 2;
        const bw = Math.min(18, step * 0.32);
        const hC = (d.cost / maxV) * plotH;
        const hV = (d.val / maxV) * plotH;
        out += `<rect x="${cx - bw - 1}" y="${pT + plotH - hC}" width="${bw}" height="${hC}" rx="5" fill="#94a3b8" opacity="0.45" />`;
        out += `<rect x="${cx + 1}" y="${pT + plotH - hV}" width="${bw}" height="${hV}" rx="5" fill="${accentHex}" opacity="0.88" />`;
        out += `<text x="${cx}" y="${pT + plotH - hV - 5}" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.8">${(d.val / unitDiv).toFixed(0)}</text>`;
        out += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">${d.y === 0 ? "現在" : "Y" + d.y}</text>`;
      });
      svg.innerHTML = out;
    }

    function init() {
      setTint(state.tint);
      document.getElementById("in-monthly").value = state.monthly;
      document.getElementById("in-extra").value = state.extra;
      document.getElementById("in-rate").value = state.rate;
      setFilter(state.filter);
      renderKPIs();
      renderWeeklyOutlook();
      renderTasks();
      renderCompounding();
    }

    loadState();
    init();
  </script>
</body>
</html>
